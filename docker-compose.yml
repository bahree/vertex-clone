version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vertex-db
    environment:
      POSTGRES_DB: vertex_db
      POSTGRES_USER: vertex_user
      POSTGRES_PASSWORD: vertex_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vertex-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertex_user -d vertex_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vertex-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://vertex_user:vertex_password@db:5432/vertex_db
      JWT_SECRET: ${JWT_SECRET:-change-this-secure-secret-key-in-production}
      JWT_EXPIRY: 7d
      FIRST_USER_IS_ADMIN: "true"
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vertex-network
    command: sh -c "npm run setup && npm start"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vertex-nginx
    ports:
      - "8888:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - vertex-network

volumes:
  postgres_data:

networks:
  vertex-network:
    driver: bridge
